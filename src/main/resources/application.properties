spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meditracker}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# we are gonna be disabling hibernate since we will be using flyway for db migrations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Fly way
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Limit request body size to prevent DOS attacks (150MB max for JSON uploads)
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB
server.tomcat.max-swallow-size=150MB

server.port=8080

# Disable default Whitelabel error page
server.error.whitelabel.enabled=false

# JWT - secret must be at least 32 characters (HS256). Generate with: openssl rand -hex 32
jwt.secret=${JWT_SECRET}
jwt.expiration-in-ms=3600000

# Public URL of the site, used for links in emails and CORS
app.base-url=${APP_BASE_URL:http://localhost:8081}

# First admin account, created on startup if no admin exists
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Outgoing mail (SMTP). If MAIL_HOST is empty, emails are written to the log instead of sent.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:MediTracker <no-reply@koala.rip>}

# Medicine list: imported from the openFDA NDC directory on first start (empty table) and weekly after that
app.medicine.auto-sync=${MEDICINE_AUTO_SYNC:true}
