services:
  postgres:
    image: postgres:16.10-alpine3.22
    container_name: meditracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: meditracker
      POSTGRES_USER: ${DB_USER:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
    # no published port: only the backend can reach the database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meditracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-myuser} -d meditracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: meditracker-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/meditracker
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
    # no published port: nginx in the frontend container proxies /api
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - meditracker-network

  frontend:
    build:
      context: ../medi-tracker-frontend
      dockerfile: Dockerfile
    container_name: meditracker-frontend
    restart: unless-stopped
    ports:
      # localhost only; the public gets in through the Cloudflare Tunnel
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    networks:
      - meditracker-network

  # Cloudflare Tunnel connector. Only started with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: meditracker-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    networks:
      - meditracker-network

volumes:
  postgres_data:

networks:
  meditracker-network:
    driver: bridge
